.days{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:44px;max-width:100%;touch-action:manipulation}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 12px}

.thumb{width:92px;height:60px;border-radius:8px;object-fit:cover;background:#000;flex:none}

.mu{color:var(--mu);font-size:13px}
.cue{font-size:14px;margin:8px 0}
.sum{font-size:16px;line-height:1.4;margin:8px 0}
a.vid{display:inline-block;margin:2px 6px 2px 0;padding:8px 12px;border-radius:10px;background:var(--card2);color:var(--ac);text-decoration:none;font-size:14px}
.last{background:var(--card2);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.hint{color:var(--ok)}
.set{display:grid;grid-template-columns:22px minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"n kg rp" ". flag flag";gap:8px;align-items:start;margin:8px 0}
.set .n{grid-area:n;color:var(--mu);font-weight:700;align-self:center}
.set .kgcol{grid-area:kg;min-width:0}
.set .repcol{grid-area:rp;min-width:0}
.set .flag{grid-area:flag}
.st{display:flex;align-items:stretch;gap:4px;min-width:0}
.st button{width:44px;min-width:44px;min-height:44px;flex:none;font-size:22px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);padding:0;touch-action:manipulation}
.st .mid{flex:1;min-width:0;text-align:center}
label.lab{display:block;font-size:13px;color:var(--mu);margin:0 0 4px}
.flag{font-size:13px;font-weight:700}
.flag.ok{color:var(--ok)}.flag.bad{color:var(--bad)}
.big{width:100%;padding:14px 16px;font-size:17px;font-weight:700;border-radius:12px;border:0;background:var(--ac);color:#06283d;margin:6px 0;min-height:48px;touch-action:manipulation}
.big.alt{background:var(--card2);color:var(--tx);border:1px solid var(--bd);font-weight:600}
.small{padding:10px 14px;min-height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:14px;touch-action:manipulation}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.miss{color:var(--bad);font-weight:700}.hit{color:var(--ok);font-weight:700}
.banner{background:#7c2d12;color:#fff;padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ok);color:#052e16;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9}
.warn{color:var(--bad);font-weight:700;font-size:15px;margin:8px 0}
label.f{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
details{margin:8px 0}summary{padding:10px 0;color:var(--ac)}
textarea{width:100%;min-height:90px}
svg{width:100%;height:auto;display:block}
.planline{margin:6px 0}
@media (max-width:480px){
 main{padding:8px}
 .card{padding:10px}
 nav{gap:2px}
 nav button{font-size:11px;padding:8px 1px}
 .set{grid-template-columns:22px minmax(0,1fr);grid-template-areas:"n kg" "n rp" ". flag"}
}
</style></head><body>

{id:'hacksquat',day:'L2',name:'Super Hack Squat',muscle:'Quads, glutes',cue:'Quad and glute squat movement. Back against the pad, feet about shoulder-width on the platform, lower under control to about a right angle at the knees, then push through the feet without bouncing or locking out. Seated leg curl stays on this day for hamstrings. 3 sets of 8 to 12.',page:'https://www.panattasport.com/en/free-weight-special/super-hack-squat/',pan:1,vt:'Panatta Super Hack Squat'},

];

 hipthrust:{id:'hipthrust',name:'Hip Thrust or Cable Pull-Through',muscle:'Glutes, hamstrings',retired:1,note:'Earlier Lower 2 option. Kept in history only. Not relabeled as Super Hack Squat.'}
};
/* ---------- seed history (weights kg / reps; ",N" = reps achieved) ---------- */
var SEED_OLD={incline:'5/10/15,10',upperback:'25/25/30',chestfly:'20/25/25,9',latraise:'15/15/20,7',hrow:'20/30/30',dips:'30/30/30',bicepsf:'10/10/12.5,7',
legpress:'20/25/30',legext:'32/37.5/37.5',seatcalf:'25/30/30',inner:'40/45/50',shrug:'10/15/15',vups:'20/25/30',
mbench:'5/10/10,8',latpull:'25/25/25',reardelt:'19/19/21.5',uprows:'27.5/32/32',upfly:'5/5/7.5,7',biceps2:'15/15/15',tricext:'30/35/35,8',
legcurl:'40/47/54',standcalf:'35/40/45',outer:'45/55/65',abs:'20/20/20'};
var SEED_U1={incline:'20/30/30,7',upperback:'25/30/30',chestfly:'20/25/25,8',latraise:'15/15/20',hrow:'30/30/35',dips:'60/70/70',bicepsf:'10/10/12.5,7'};
function parseSeed(s){return s.split('/').map(function(t){var p=t.split(',');return {w:parseFloat(p[0]),r:p[1]?parseInt(p[1],10):12};});}
function SEED_BODY(){return {scans:[{id:'b1',date:'2026-09-27',w:101.7,fat:43.1,pct:42.4,lean:58.6,smm:32.8,vis:20,bmi:35.2},{id:'b2',date:'2026-11-02',w:105.7,fat:44.0,pct:41.6,lean:61.7,smm:34.6,vis:19,bmi:36.6}],weighins:[]};}
function seedData(){
 var logs=[],n=0;
 Object.keys(SEED_OLD).forEach(function(k){logs.push({id:'s'+(n++),ex:k,date:'',sets:parseSeed(SEED_OLD[k]),target:12});});
 Object.keys(SEED_U1).forEach(function(k){logs.push({id:'s'+(n++),ex:k,date:'2026-11-02',sets:parseSeed(SEED_U1[k]),target:12});});
 return {v:3,custom:[],logs:logs,cardio:[],targets:{kcal:1800,p:150,c:165,f:60},food:[],body:SEED_BODY()};
}
/* ---------- storage (localStorage). Same key and v3 shape; drafts are optional. ---------- */
var KEY='liftlogger.v1',persistOK=true,corruptStore=false,dirty=false,savedThisSession=false,D;
var seq=0;
function uid(p){seq+=1;return p+Date.now().toString(36)+seq.toString(36);}
function emptyDrafts(){return {sets:{},food:{},cardio:{},body:{weighin:{},scan:{}},targets:{}};}
function load(){
 var raw=null;
 try{raw=localStorage.getItem(KEY);}catch(e){persistOK=false;D=seedData();fixD();return;}
 if(raw){
  try{
   D=JSON.parse(raw);
   if(!D||typeof D!=='object'||Array.isArray(D))throw new Error('bad');
   fixD();
   return;
  }catch(e){
   persistOK=false;corruptStore=true;D=seedData();fixD();return;
  }
 }
 D=seedData();fixD();save({quiet:true});
}
function save(opts){
 dirty=true;
 if(corruptStore){persistOK=false;markStatus();return false;}
 var text;
 try{text=JSON.stringify(D);}catch(e){persistOK=false;markStatus();return false;}
 try{localStorage.setItem(KEY,text);}catch(e){persistOK=false;markStatus();return false;}
 dirty=false;
 if(!(opts&&opts.quiet))savedThisSession=true;
 persistOK=true;
 markStatus();
 return true;
}
function fixD(){
 D.custom=Array.isArray(D.custom)?D.custom:[];
 D.logs=Array.isArray(D.logs)?D.logs:[];
 D.cardio=Array.isArray(D.cardio)?D.cardio:[];
 D.food=Array.isArray(D.food)?D.food:[];
 if(!D.targets||typeof D.targets!=='object'||Array.isArray(D.targets))D.targets={kcal:1800,p:150,c:165,f:60};
 if(!D.body||typeof D.body!=='object'||Array.isArray(D.body))D.body=SEED_BODY();
 D.body.scans=Array.isArray(D.body.scans)?D.body.scans:[];
 D.body.weighins=Array.isArray(D.body.weighins)?D.body.weighins:[];
 D.cardio.forEach(function(x){if(x&&!x.machine)x.machine='Incline walk';});
 if(!D.drafts||typeof D.drafts!=='object'||Array.isArray(D.drafts))D.drafts=emptyDrafts();
 var dr=D.drafts;
 if(!dr.sets||typeof dr.sets!=='object'||Array.isArray(dr.sets))dr.sets={};
 if(!dr.food||typeof dr.food!=='object'||Array.isArray(dr.food))dr.food={};
 if(!dr.cardio||typeof dr.cardio!=='object'||Array.isArray(dr.cardio))dr.cardio={};
 if(!dr.body||typeof dr.body!=='object'||Array.isArray(dr.body))dr.body={};
 if(!dr.body.weighin||typeof dr.body.weighin!=='object'||Array.isArray(dr.body.weighin))dr.body.weighin={};
 if(!dr.body.scan||typeof dr.body.scan!=='object'||Array.isArray(dr.body.scan))dr.body.scan={};
 if(!dr.targets||typeof dr.targets!=='object'||Array.isArray(dr.targets))dr.targets={};
}
var MACHINES=['Incline walk'];
/* ---------- numbers: accept Arabic-Indic and Eastern Arabic digits if the OS ignores lang ---------- */
function normalizeNumericText(s){
 return String(s)
  .replace(/[\u0660-\u0669]/g,function(ch){return String(ch.charCodeAt(0)-0x0660);})
  .replace(/[\u06F0-\u06F9]/g,function(ch){return String(ch.charCodeAt(0)-0x06F0);})
  .replace(/\u066B/g,'.')
  .replace(/\u066C/g,'')
  .replace(/\u060C/g,'.')
  .replace(/,/g,'.');
}
function parseNum(raw){
 if(raw==null)return null;
 var s=normalizeNumericText(raw).trim();
 if(s===''||s==='.'||s==='-'||s==='-.')return null;
 var n=Number(s);
 return isFinite(n)?n:null;
}
function sameNumText(a,b){
 if(normalizeNumericText(a)===normalizeNumericText(b))return true;
 var na=parseNum(a),nb=parseNum(b);
 return na!=null&&nb!=null&&na===nb;
}
function normalizeInputElement(el){
 var v=el.value,n=normalizeNumericText(v);
 if(n!==v){
  var a=null,b=null;
  try{a=el.selectionStart;b=el.selectionEnd;}catch(e){}
  el.value=n;
  if(a!=null){try{el.setSelectionRange(a,b==null?a:b);}catch(e2){}}
 }
 return el.value;
}
function insertTextAtCaret(el,text){
 var v=el.value||'',a=v.length,b=v.length;
 try{if(el.selectionStart!=null){a=el.selectionStart;b=el.selectionEnd;}}catch(e){}
 el.value=v.slice(0,a)+text+v.slice(b);
 var p=a+text.length;
 try{el.setSelectionRange(p,p);}catch(e2){}
}
/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);}
function allEx(){return EX.concat(D.custom.map(function(c){return {id:c.id,day:c.day,name:c.name,muscle:c.muscle||'Custom exercise',cue:'',custom:1};}));}
function exById(id){
 var e=allEx().filter(function(x){return x.id===id;})[0];

function historyList(){
 var list=allEx().slice(),seen={};
 list.forEach(function(e){seen[e.id]=1;});

  if(seen[id])return;

function fmt(n){return String(Math.round(n*100)/100);}
function dl(d){return d||'Old log';}
function logsFor(ex){return D.logs.filter(function(l){return l.ex===ex;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});}
function logFor(exId,date){var a=D.logs.filter(function(l){return l.ex===exId&&l.date===date;});return a.length?a[a.length-1]:null;}
function priorLog(exId,date){var a=logsFor(exId).filter(function(l){return l.date!==date;});return a.length?a[a.length-1]:null;}
function setNums(s){
 if(!s)return {w:null,r:null};
 function one(key){
  if(Object.prototype.hasOwnProperty.call(s,key+'Raw')){
   if(s[key+'Raw']==null||s[key+'Raw']==='')return null;
   if(s[key]!=null&&isFinite(s[key]))return s[key];
   return parseNum(s[key+'Raw']);
  }
  if(s[key]==null)return null;
  return isFinite(s[key])?s[key]:null;
 }
 return {w:one('w'),r:one('r')};
}
function setsStr(l){
 return l.sets.map(function(s){
  var n=setNums(s);
  if(n.w==null&&n.r==null)return '<span class="mu">—</span>';
  var ws=n.w==null?'—':fmt(n.w);
  if(n.r==null)return '<span class="mu">'+ws+'×—</span>';
  var miss=n.r<l.target;
  return '<span class="'+(miss?'miss':'hit')+'">'+ws+'×'+n.r+(miss?' ✗':' ✓')+'</span>';

}
function missCount(l){return l.sets.filter(function(s){var r=setNums(s).r;return r!=null&&r<l.target;}).length;}
function sessionNote(l){
 var nums=l.sets.map(setNums);
 var anyR=nums.some(function(s){return s.r!=null;});

 if(!anyR)return 'Weight saved. Reps not entered.';
 var mc=missCount(l);

  if(!create)return null;

  if(Object.prototype.hasOwnProperty.call(s,key+'Raw'))return s[key+'Raw']==null?'':String(s[key+'Raw']);

 var target=l&&l.target!=null?l.target:currentTarget(id,S.date);
 for(var i=0;i<3;i++){
  var s=l?(l.sets[i]||l.sets[l.sets.length-1]):null;
  var w=s&&setNums(s).w!=null?setNums(s).w:0;
  d.sets[i].w=String(w);
  d.sets[i].r=String(target);
 }
 delete S.warn[id];
 syncSessionLog(S.date,id);
 save();
 replaceCard(id);
}
function bumpAll(id){
 var d=getDraft(S.date,id,true);
 for(var i=0;i<3;i++){
  var n=parseNum(fieldShown(id,i,'w',S.date));
  if(n==null)n=0;
  d.sets[i].w=String(Math.round((n+2.5)*100)/100);
 }
 delete S.warn[id];
 syncSessionLog(S.date,id);
 save();
 replaceCard(id);
}
function cycleTarget(id){
 var cur=currentTarget(id,S.date);
 var next={8:10,10:12,12:15,15:8}[cur]||12;
 var d=getDraft(S.date,id,true);
 d.target=next;
 for(var i=0;i<3;i++){
  if(!d.sets[i])d.sets[i]={};
  if(fieldRaw(id,i,'r',S.date)!=null)d.sets[i].r=String(next);
 }
 delete S.warn[id];
 if(setsTouched(d))syncSessionLog(S.date,id);
 else {var existing=logFor(id,S.date);if(existing)existing.target=next;}
 save();
 replaceCard(id);
}
function markExerciseDone(id){
 flushOpenInputs();
 if(dirty)save();
 var gaps=gapsFor(id,S.date);
 blurActive();
 if(gaps.length){
  S.warn[id]=warnText(gaps);
  replaceCard(id);
  return;
 }
 var d=getDraft(S.date,id,true);
 d.complete=true;
 d.collapsed=true;
 delete S.warn[id];
 save();
 replaceCard(id);
}
function reopenExercise(id){
 var d=getDraft(S.date,id,true);
 d.collapsed=false;
 save();
 replaceCard(id);
}
function onSetInput(el){
 var id=el.dataset.e,i=+el.dataset.i,key=el.dataset.a==='wi'?'w':'r';
 var dom=normalizeInputElement(el);
 var d=getDraft(S.date,id,true);
 if(!d.sets[i])d.sets[i]={};
 d.sets[i][key]=dom;
 delete S.warn[id];
 syncSessionLog(S.date,id);
 save();
 paintFlag(id,i);
 var card=document.getElementById('c-'+id);
 if(card){var w=card.querySelector('.warn');if(w)w.remove();}
}
function readFoodDom(){
 return {
  label:document.getElementById('fl')?document.getElementById('fl').value:'',
  kcal:document.getElementById('fk')?document.getElementById('fk').value:'',
  p:document.getElementById('fp')?document.getElementById('fp').value:'',
  c:document.getElementById('fc')?document.getElementById('fc').value:'',
  f:document.getElementById('ff')?document.getElementById('ff').value:''
 };
}
function onFoodInput(){
 if(!document.getElementById('fl'))return;
 ['fk','fp','fc','ff'].forEach(function(id){var el=document.getElementById(id);if(el)normalizeInputElement(el);});
 var next=readFoodDom();
 var prev=D.drafts.food[S.calDate];
 if(prev&&prev.label===next.label&&prev.kcal===next.kcal&&prev.p===next.p&&prev.c===next.c&&prev.f===next.f)return;
 if(!prev&&!next.label&&!next.kcal&&!next.p&&!next.c&&!next.f)return;
 D.drafts.food[S.calDate]=next;
 save();
}
function foodNum(id){var n=parseNum(document.getElementById(id).value);return n==null?0:Math.max(0,n);}
function addFood(){
 if(!document.getElementById('fl'))return;
 onFoodInput();
 var fe={id:uid('f'),date:S.calDate,label:document.getElementById('fl').value.trim(),kcal:foodNum('fk'),p:foodNum('fp'),c:foodNum('fc'),f:foodNum('ff')};
 if(!fe.kcal&&!fe.p&&!fe.c&&!fe.f){toast('Enter at least kcal');return;}
 D.food.push(fe);
 delete D.drafts.food[S.calDate];
 save();toast('Added');render();
}
function onTargetInput(el){
 if(!el||!el.dataset||!el.dataset.k)return;
 var key=el.dataset.k;
 var raw=normalizeInputElement(el);
 D.drafts.targets[key]=raw;
 if(String(raw).trim()==='')D.targets[key]=null;
 else {var n=parseNum(raw);if(n!=null&&n>=0)D.targets[key]=n;}
 save();
}
function onWeighinInput(){
 var wd=document.getElementById('wd'),wk=document.getElementById('wk');
 if(!wd||!wk)return;
 var kg=normalizeInputElement(wk);
 var prev=D.drafts.body.weighin||{};
 if(prev.date===wd.value&&prev.kg===kg)return;
 D.drafts.body.weighin={date:wd.value,kg:kg};
 save();
}
function onScanInput(){
 var bd=document.getElementById('bd');
 if(!bd)return;
 var next={date:bd.value};
 ['bw','bf','bp','bl','bs','bv','bm'].forEach(function(id){
  var el=document.getElementById(id);
  if(el)next[id]=normalizeInputElement(el);
 });
 D.drafts.body.scan=next;
 save();
}
function onCardioInput(el){
 var d=ensureCardio(S.cardioDate);
 ['min','incline','speed'].forEach(function(k){
  var node=document.querySelector('input[data-a="cdi"][data-k="'+k+'"]');
  if(node)d[k]=normalizeNumericText(node.value);
 });
 var mach=document.getElementById('cmach');
 if(mach)d.machine=mach.value;
 if(el&&el.dataset&&el.dataset.k)d[el.dataset.k]=normalizeInputElement(el);
 upsertCardio(d);
 save();
}
function stepCardio(key,dir){
 var shown=cardioShown(S.cardioDate);
 var cur=parseNum(shown[key]);
 if(cur==null)cur=0;
 var stp=key==='speed'?0.5:1;
 var lim={min:[1,180],incline:[1,15],speed:[1,12]}[key];
 var n=clamp(Math.round((cur+dir*stp)*10)/10,lim[0],lim[1]);
 var d=ensureCardio(S.cardioDate);
 d[key]=String(n);
 upsertCardio(d);
 save();
 render();
}
function addWeighin(){
 var wk=document.getElementById('wk'),wd=document.getElementById('wd');
 if(!wk)return;
 onWeighinInput();
 var wv=parseNum(wk.value);
 if(wv==null||wv<=0){toast('Enter your weight');return;}
 var wdt=wd.value||today();
 D.body.weighins=D.body.weighins.filter(function(x){return x.date!==wdt;});
 D.body.weighins.push({id:uid('w'),date:wdt,w:wv});
 D.drafts.body.weighin={date:wdt,kg:''};
 save();toast('Added');render();
}
function addScan(){
 var bd=document.getElementById('bd');
 if(!bd)return;
 onScanInput();
 function nv(i){return parseNum(document.getElementById(i).value);}
 var sn={id:uid('b'),date:bd.value||today(),w:nv('bw'),fat:nv('bf'),pct:nv('bp'),lean:nv('bl'),smm:nv('bs'),vis:nv('bv'),bmi:nv('bm')};
 if(sn.w==null){toast('Enter at least weight');return;}
 ['fat','pct','lean','smm','vis','bmi'].forEach(function(k){if(sn[k]==null)sn[k]=0;});
 D.body.scans=D.body.scans.filter(function(x){return x.date!==sn.date;});
 D.body.scans.push(sn);
 D.drafts.body.scan={date:sn.date};
 save();toast('Scan added');render();
}
function flushOpenInputs(){
 document.querySelectorAll('input[data-a="wi"],input[data-a="ri"]').forEach(function(el){
  var id=el.dataset.e,i=+el.dataset.i,key=el.dataset.a==='wi'?'w':'r';
  var dom=normalizeNumericText(el.value);
  var raw=fieldRaw(id,i,key,S.date);
  var shown=raw==null?fieldShown(id,i,key,S.date):raw;
  if(raw==null&&sameNumText(shown,dom))return;
  if(raw!=null&&normalizeNumericText(String(raw))===dom)return;
  var d=getDraft(S.date,id,true);
  if(!d.sets[i])d.sets[i]={};
  d.sets[i][key]=dom;
  syncSessionLog(S.date,id);
  dirty=true;
 });
 var active=document.activeElement;
 if(active&&active.id&&['fl','fk','fp','fc','ff'].indexOf(active.id)>=0)onFoodInput();
 if(active&&active.dataset&&active.dataset.k&&active.id&&active.id.charAt(0)==='t')onTargetInput(active);
 if(active&&(active.id==='wd'||active.id==='wk'))onWeighinInput();
 if(active&&(active.id==='bd'||(active.dataset&&active.dataset.scan)))onScanInput();
 if(active&&active.dataset&&active.dataset.a==='cdi')onCardioInput(active);
}
function download(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}
function copy(t,msg){var ok=function(){toast(msg||'Copied');};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){fb();});}else fb();
 function fb(){var x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');ok();}catch(e){prompt('Copy this:',t);}x.remove();}}
function doImport(txt){
 try{
  var d=JSON.parse(txt);
  if(!d||!Array.isArray(d.logs)||!Array.isArray(d.cardio))throw 0;
  if(!confirm('Replace all current data with the backup ('+d.logs.length+' entries)?'))return;
  D=d;fixD();save();S.warn={};toast('Imported');render();
 }catch(e){alert('That is not a valid backup.');}
}
document.addEventListener('beforeinput',function(ev){
 var t=ev.target;
 if(!t||t.tagName!=='INPUT'||!t.dataset||!t.dataset.num)return;
 if(ev.inputType!=='insertText'||ev.data==null)return;
 var norm=normalizeNumericText(ev.data);
 if(norm===ev.data)return;
 ev.preventDefault();
 insertTextAtCaret(t,norm);
 t.dispatchEvent(new Event('input',{bubbles:true}));
});
document.addEventListener('input',function(ev){
 var t=ev.target;
 if(!t||!t.dataset)return;
 if(t.dataset.a==='wi'||t.dataset.a==='ri'){onSetInput(t);return;}
 if(t.dataset.a==='cdi'){onCardioInput(t);return;}
 if(t.id==='fl'||t.id==='fk'||t.id==='fp'||t.id==='fc'||t.id==='ff'){onFoodInput();return;}
 if(t.id==='tk'||t.id==='tp'||t.id==='tc'||t.id==='tf'){onTargetInput(t);return;}
 if(t.id==='wd'||t.id==='wk'){onWeighinInput();return;}
 if(t.id==='bd'||t.dataset.scan){onScanInput();return;}
});
document.addEventListener('click',function(ev){
 var b=ev.target.closest('[data-a],[data-tab]');
 if(!b)return;
 if(b.dataset.tab){S.tab=b.dataset.tab;rememberUi();render();window.scrollTo(0,0);return;}
 var a=b.dataset.a,id=b.dataset.e,i=+b.dataset.i;
 switch(a){
 case 'day':S.day=b.dataset.d;S.warn={};rememberUi();render();break;
 case 'w-':stepSet(id,i,'w',-2.5);break;
 case 'w+':stepSet(id,i,'w',2.5);break;
 case 'r-':stepSet(id,i,'r',-1);break;
 case 'r+':stepSet(id,i,'r',1);break;
 case 'same':sameAsLast(id);break;
 case 'up':bumpAll(id);break;
 case 'tgt':cycleTarget(id);break;
 case 'exdone':markExerciseDone(id);break;
 case 'editex':reopenExercise(id);break;
 case 'addex':var nm=prompt('Exercise name?');if(!nm)break;var mu=prompt('Muscle (optional)?')||'';D.custom.push({id:uid('x'),day:S.day,name:nm.trim(),muscle:mu.trim()});save();render();break;
 case 'dellog':if(confirm('Delete this entry?')){var victim=D.logs.filter(function(l){return l.id===b.dataset.l;})[0];D.logs=D.logs.filter(function(l){return l.id!==b.dataset.l;});if(victim&&D.drafts.sets[victim.date])delete D.drafts.sets[victim.date][victim.ex];save();render();}break;
 case 'cd-':stepCardio(b.dataset.k,-1);break;
 case 'cd+':stepCardio(b.dataset.k,1);break;
 case 'delcd':if(confirm('Delete this cardio entry?')){var idx=+b.dataset.i,row=D.cardio[idx];if(!row)break;D.cardio.splice(idx,1);if(row.date&&D.drafts.cardio[row.date])delete D.drafts.cardio[row.date];save();render();}break;
 case 'lbl':var fl=document.getElementById('fl');if(fl){fl.value=b.dataset.v;onFoodInput();}break;
 case 'foodadd':addFood();break;
 case 'foodrep':var o=D.food.filter(function(e){return e.id===b.dataset.l;})[0];if(o){D.food.push({id:uid('f'),date:S.calDate,label:o.label,kcal:o.kcal,p:o.p,c:o.c,f:o.f});save();toast('Added');render();}break;
 case 'fooddel':if(confirm('Delete this entry?')){D.food=D.food.filter(function(e){return e.id!==b.dataset.l;});save();render();}break;
 case 'calday':S.calDate=b.dataset.d;rememberUi();render();window.scrollTo(0,0);break;
 case 'addw':addWeighin();break;
 case 'addscan':addScan();break;
 case 'delw':if(confirm('Delete?')){D.body.weighins=D.body.weighins.filter(function(x){return x.id!==b.dataset.l;});save();render();}break;
 case 'delscan':if(confirm('Delete this scan?')){D.body.scans=D.body.scans.filter(function(x){return x.id!==b.dataset.l;});save();render();}break;
 case 'copySum':copy(summaryText(),'Summary copied');break;
 case 'dlSnap':download('khalid-progress-snapshot-'+today()+'.html',snapshotHtml(),'text/html');break;
 case 'shareSnap':var f=new File([snapshotHtml()],'khalid-progress-snapshot-'+today()+'.html',{type:'text/html'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'My lift progress',text:summaryText()}).catch(function(){});
  else if(navigator.share)navigator.share({title:'My lift progress',text:summaryText()}).catch(function(){});
  else{download(f.name,snapshotHtml(),'text/html');toast('Snapshot downloaded. Send that file.');}break;
 case 'export':download('lift-logger-backup-'+today()+'.json',JSON.stringify(D,null,1));break;
 case 'copyjson':copy(JSON.stringify(D),'Backup copied');break;
 case 'import':var fi=document.getElementById('impf');if(fi.files&&fi.files[0]){var r=new FileReader();r.onload=function(){doImport(r.result);};r.readAsText(fi.files[0]);}else doImport(document.getElementById('impt').value);break;
 }
});
document.addEventListener('change',function(ev){
 var t=ev.target;if(!t)return;
 if(t.id==='dt'){S.date=isDate(t.value)?t.value:today();S.warn={};rememberUi();render();return;}
 if(t.id==='cdt'){S.cardioDate=isDate(t.value)?t.value:today();rememberUi();render();return;}
 if(t.id==='cmach'){onCardioInput(t);return;}
 if(t.id==='cald'){S.calDate=isDate(t.value)?t.value:today();rememberUi();render();return;}
 if(t.id==='hex'){S.histEx=t.value;rememberUi();render();return;}
 if(t.id==='wd')onWeighinInput();
 if(t.id==='bd')onScanInput();
});
function onHide(){
 try{flushOpenInputs();}catch(e){}
 if(dirty)save({quiet:true});
}
window.addEventListener('pagehide',onHide);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')onHide();});
load();
applyUi();
render();
markStatus();
</script></body></html>
